<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS / Android app: Hesychius, Γλῶσσαι</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script>
/* Apply saved display choices before the page paints, so there is no flash. */
(function () {
  try {
    var t = localStorage.getItem("hesychius.theme"), g = localStorage.getItem("hesychius.greek");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    if (g === "gentium" || g === "system") document.documentElement.setAttribute("data-greek", g);
  } catch (e) {}
})();
</script>
<style>
  :root {
    color-scheme: light;
    --paper: #eceff1; --ink: #17222b; --muted: #55656f; --rule: #c3ced4; --accent: #1d5a73; --warn: #9a5b00;
    --font: "New Athena Unicode", "Gentium Plus", "Palatino Linotype", "Book Antiqua", "Times New Roman", serif;
  }
  :root[data-greek="gentium"] { --font: "Gentium Plus", "Palatino Linotype", "Book Antiqua", "Times New Roman", serif; }
  :root[data-theme="dark"] {
    color-scheme: dark; --paper: #131b21; --ink: #e4eaee; --muted: #94a5af; --rule: #2b3a44; --accent: #7fc0d9; --warn: #e2b04e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark; --paper: #131b21; --ink: #e4eaee; --muted: #94a5af; --rule: #2b3a44; --accent: #7fc0d9; --warn: #e2b04e;
    }
  }
  :root[data-greek="system"] :lang(grc) { font-family: initial; }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; color: var(--ink); font-family: var(--font); font-size: 1.05rem; line-height: 1.5; }
  main { max-width: 42rem; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 .4rem; }
  h2 { font-size: 1.25rem; line-height: 1.3; margin: 1.75rem 0 .4rem; }
  p, li { max-width: 40rem; }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .lede { color: var(--muted); }
  ol, ul { padding-left: 1.3rem; }
  li + li { margin-top: .25rem; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88em; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; margin: .5rem 0; }
  th, td { text-align: left; padding: .35rem .6rem .35rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-weight: 700; }
  .warn { border-left: 3px solid var(--warn); padding-left: .8rem; }
  .small { font-size: .95rem; color: var(--muted); }
</style>
</head>
<body>

<main>
  <p><a href="index.html">Back to the lexicon</a></p>
  <h1>iOS / Android app</h1>
  <p>Coming soon. Maybe.</p>
</main>
